<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A4 对折 100 次 · 3D</title>
<style>
:root{--bg:#090b12;--card:rgba(18,20,28,.82);--line:rgba(255,255,255,.12);--text:#f6f7fb;--muted:#a8acb8;--red:#ff5e4d;--blue:#5c79ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);overflow:hidden}
#app{height:100svh;display:flex;flex-direction:column;position:relative;background:#0a0c12}
#scene{position:absolute;inset:0;z-index:0}
.top{position:absolute;left:16px;right:16px;top:max(16px,env(safe-area-inset-top));z-index:4;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{max-width:68%}.brand h1{margin:0;font-size:26px;line-height:1;letter-spacing:-1px;text-shadow:0 2px 18px #000}.brand p{margin:7px 0 0;color:#e6e7ec;font-size:12px;text-shadow:0 2px 12px #000}
.foldBadge{background:rgba(255,255,255,.9);color:#111;padding:9px 12px;border-radius:999px;font-size:13px;font-weight:900;box-shadow:0 8px 24px #0004}
.scaleTag{position:absolute;left:16px;bottom:285px;z-index:4;background:rgba(7,8,12,.76);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:15px;padding:10px 13px;max-width:78%;font-size:12px;line-height:1.4;box-shadow:0 12px 35px #0005}
.scaleTag b{font-size:15px}
.panel{position:absolute;z-index:5;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(16,18,25,.78),rgba(12,14,20,.94));border:1px solid var(--line);border-radius:22px;padding:10px;backdrop-filter:blur(18px);box-shadow:0 -18px 55px #0005;transition:transform .28s ease,max-height .28s ease,padding .28s ease}
.panel.collapsed{padding:8px 10px}
.panel.collapsed .stats,.panel.collapsed input,.panel.collapsed .btns,.panel.collapsed .auto,.panel.collapsed .tip{display:none}
.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.panelHead b{font-size:13px}
.panelToggle{border:0;background:rgba(255,255,255,.10);color:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.panel.collapsed .panelHead{margin-bottom:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:10px 11px}.stat small{color:var(--muted);display:block;font-size:11px}.stat strong{display:block;margin-top:3px;font-size:18px;line-height:1.1;word-break:break-word}.compare{grid-column:1/-1}.compare strong{font-size:15px}
input[type=range]{width:100%;accent-color:var(--red);margin:11px 0 5px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:14px;padding:12px 8px;font-weight:900;font-size:14px}.reset{background:#f4f4f7;color:#111}.fold{background:var(--red);color:white}.auto{width:100%;margin-top:8px;background:var(--blue);color:#fff}
.tip{text-align:center;color:#9ca2af;font-size:10px;margin-top:8px}
.flash{position:absolute;inset:0;z-index:3;pointer-events:none;background:white;opacity:0}.flash.on{animation:flash .28s}@keyframes flash{0%{opacity:0}.35%{opacity:.10}100%{opacity:0}}
@media(min-width:760px){#app{max-width:540px;margin:auto;border-left:1px solid #ffffff10;border-right:1px solid #ffffff10}.brand h1{font-size:30px}}
</style>
</head>
<body>
<div id="app">
  <div id="scene"></div>
  <div class="flash" id="flash"></div>
  <div class="top">
    <div class="brand"><h1>A4 对折 100 次</h1><p>0.10 mm 起步 · 数值按指数精确计算</p></div>
    <div class="foldBadge">第 <span id="foldN">0</span> 次</div>
  </div>
  <div class="scaleTag" id="scaleTag"><b>桌面尺度</b><br>真实 A4 纸从桌面开始。</div>
  <div class="panel" id="panel">
    <div class="panelHead"><b>参数</b><button class="panelToggle" id="panelToggle">收起</button></div>
    <div class="stats">
      <div class="stat"><small>理论厚度</small><strong id="thick">0.10 mm</strong></div>
      <div class="stat"><small>纸层数</small><strong id="layers">1 层</strong></div>
      <div class="stat compare"><small>现在相当于</small><strong id="compare">一张普通 A4 纸。</strong></div>
    </div>
    <input id="slider" type="range" min="0" max="100" value="0">
    <div class="btns">
      <button class="btn reset" id="reset">重新开始</button>
      <button class="btn fold" id="fold">对折一次</button>
    </div>
    <button class="btn auto" id="auto">自动折到 100 次</button>
    <div class="tip">第 7 次以后属于数学理想模型；3D 镜头使用对数尺度展示。</div>
  </div>
</div>

<script src="./three.min.js"></script>
<script>
(()=>{
const THREE=window.THREE;
if(!THREE){document.getElementById('scene').innerHTML='<div style="padding:120px 20px">3D 引擎加载失败，请刷新页面。</div>';return}
const host=document.getElementById('scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10131a);
scene.fog=new THREE.FogExp2(0x10131a,.010);
const camera=new THREE.PerspectiveCamera(48,1,.01,2e7);
camera.position.set(0,3.2,6.2);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xcfe7ff,0x342b24,2.4); scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,3.6); key.position.set(4,8,5);key.castShadow=true;scene.add(key);
const warm=new THREE.PointLight(0xffc36a,8,20);warm.position.set(-3,2,2);scene.add(warm);

const world=new THREE.Group();scene.add(world);
const localGroup=new THREE.Group(), cityGroup=new THREE.Group(), earthGroup=new THREE.Group(), solarGroup=new THREE.Group(), galaxyGroup=new THREE.Group();
world.add(localGroup,cityGroup,earthGroup,solarGroup,galaxyGroup);

function mat(c,rough=.65,metal=.05){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function mesh(g,m,group=world){const o=new THREE.Mesh(g,m);o.castShadow=o.receiveShadow=true;group.add(o);return o}

// local scene
const table=mesh(new THREE.BoxGeometry(8,.25,8),mat(0x9d704d,.8),localGroup);table.position.y=-.22;
const coin=mesh(new THREE.CylinderGeometry(.46,.46,.08,64),mat(0xd6ad35,.32,.65),localGroup);coin.rotation.x=Math.PI/2;coin.position.set(1.65,.10,.15);
const book=mesh(new THREE.BoxGeometry(1.5,.22,2.05),mat(0x315f9f,.55),localGroup);book.position.set(-1.75,.12,.6);book.rotation.y=.16;
const mug=mesh(new THREE.CylinderGeometry(.45,.48,.85,32),mat(0xe8e3da,.55),localGroup);mug.position.set(2.1,.42,-1.35);

// city
const ground=mesh(new THREE.CircleGeometry(250,64),mat(0x4c5157,.96),cityGroup);ground.rotation.x=-Math.PI/2;ground.position.y=-2;
for(let i=0;i<38;i++){const a=i*.73,r=18+(i%7)*18,h=6+(i%9)*5;const b=mesh(new THREE.BoxGeometry(5+(i%3)*2,h,5+(i%4)),mat(0x77808c,.74),cityGroup);b.position.set(Math.cos(a)*r,h/2-2,Math.sin(a)*r)}
cityGroup.scale.setScalar(.07);cityGroup.visible=false;

// earth/moon
const earth=mesh(new THREE.SphereGeometry(4,64,64),new THREE.MeshStandardMaterial({color:0x2b83c6,roughness:.72,metalness:0}),earthGroup);
const landMat=new THREE.MeshStandardMaterial({color:0x4e9d62,roughness:.9});
for(let i=0;i<12;i++){const land=mesh(new THREE.SphereGeometry(.45+.12*(i%3),24,16),landMat,earthGroup);const a=i*.83,b=.6*Math.sin(i*1.7);land.position.set(4.03*Math.cos(b)*Math.cos(a),4.03*Math.sin(b),4.03*Math.cos(b)*Math.sin(a));land.scale.set(1.8,.35,.8);land.lookAt(0,0,0)}
const moon=mesh(new THREE.SphereGeometry(1.08,40,40),mat(0xbebdb9,.96),earthGroup);moon.position.set(12,2,-2);
earthGroup.visible=false;

// sun + orbit
const sunMat=new THREE.MeshBasicMaterial({color:0xffb126});
const sun=mesh(new THREE.SphereGeometry(3.2,64,64),sunMat,solarGroup);
const sunLight=new THREE.PointLight(0xffc45b,75,160);solarGroup.add(sunLight);
const orbit=new THREE.Mesh(new THREE.TorusGeometry(14,.025,8,180),new THREE.MeshBasicMaterial({color:0x8194bd,transparent:true,opacity:.45}));orbit.rotation.x=Math.PI/2;solarGroup.add(orbit);
const tinyEarth=mesh(new THREE.SphereGeometry(.34,24,24),mat(0x3188cc,.7),solarGroup);tinyEarth.position.x=14;
solarGroup.visible=false;

// galaxy points
const pts=[];for(let i=0;i<7000;i++){const arm=i%4;const r=Math.pow(Math.random(),.62)*28;const angle=r*.43+arm*Math.PI/2+(Math.random()-.5)*.7;const y=(Math.random()-.5)*Math.max(.25,2.1-r*.055);pts.push(Math.cos(angle)*r,y,Math.sin(angle)*r)}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
const galPts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xd9e0ff,size:.16,sizeAttenuation:true,transparent:true,opacity:1}));galaxyGroup.add(galPts);
const core=mesh(new THREE.SphereGeometry(3.0,40,40),new THREE.MeshBasicMaterial({color:0xfff0b0,transparent:true,opacity:.82}),galaxyGroup);
const galGlow=mesh(new THREE.SphereGeometry(7,40,40),new THREE.MeshBasicMaterial({color:0x6f78ff,transparent:true,opacity:.10,depthWrite:false}),galaxyGroup);
galaxyGroup.rotation.x=.18;galaxyGroup.rotation.z=-.18;galaxyGroup.visible=false;

// symbolic cosmic paper stack + reference markers
const cosmicGroup=new THREE.Group();world.add(cosmicGroup);cosmicGroup.visible=false;
const rulerGroup=new THREE.Group();world.add(rulerGroup);rulerGroup.visible=false;
const rulerLine=mesh(new THREE.CylinderGeometry(.055,.055,10,20),new THREE.MeshBasicMaterial({color:0xffffff}),rulerGroup);
rulerLine.position.y=5;
const rulerGlow=mesh(new THREE.CylinderGeometry(.20,.20,10,20),new THREE.MeshBasicMaterial({color:0x90a7ff,transparent:true,opacity:.12,depthWrite:false}),rulerGroup);
rulerGlow.position.y=5;
const rulerCap1=mesh(new THREE.SphereGeometry(.18,20,20),new THREE.MeshBasicMaterial({color:0xffffff}),rulerGroup);rulerCap1.position.y=0;
const rulerCap2=mesh(new THREE.SphereGeometry(.18,20,20),new THREE.MeshBasicMaterial({color:0xffffff}),rulerGroup);rulerCap2.position.y=10;
const beamMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.95});
const beam=mesh(new THREE.BoxGeometry(.65,12,.65),beamMat,cosmicGroup);beam.position.y=0;
const beamGlow=mesh(new THREE.BoxGeometry(1.5,12,1.5),new THREE.MeshBasicMaterial({color:0x90a5ff,transparent:true,opacity:.12,depthWrite:false}),cosmicGroup);
const starA=mesh(new THREE.SphereGeometry(.42,32,32),new THREE.MeshBasicMaterial({color:0xffdf7d}),cosmicGroup);starA.position.set(-7,-3,0);
const starB=mesh(new THREE.SphereGeometry(.42,32,32),new THREE.MeshBasicMaterial({color:0xa9c7ff}),cosmicGroup);starB.position.set(7,3,0);
const starGlowA=mesh(new THREE.SphereGeometry(1.0,32,32),new THREE.MeshBasicMaterial({color:0xffb43e,transparent:true,opacity:.18,depthWrite:false}),cosmicGroup);starGlowA.position.copy(starA.position);
const starGlowB=mesh(new THREE.SphereGeometry(1.0,32,32),new THREE.MeshBasicMaterial({color:0x6fa1ff,transparent:true,opacity:.18,depthWrite:false}),cosmicGroup);starGlowB.position.copy(starB.position);

// paper stack
const paperGroup=new THREE.Group();world.add(paperGroup);
const paperMat=mat(0xfaf8f1,.72,.02);
const edgeMat=mat(0xd9d5cb,.88,0);
const paper=mesh(new THREE.BoxGeometry(2.1,.03,2.97),paperMat,paperGroup);
paper.position.y=.02;
const paperGlow=mesh(new THREE.BoxGeometry(2.16,.034,3.03),new THREE.MeshBasicMaterial({color:0xcfd9ff,transparent:true,opacity:.12,depthWrite:false}),paperGroup);
paperGlow.position.y=.02;
const edgeLines=new THREE.LineSegments(new THREE.EdgesGeometry(paper.geometry),new THREE.LineBasicMaterial({color:0xc5c0b6}));paper.add(edgeLines);

const labels={
0:['真实折纸阶段','前 1–8 次重点看纸张本身：面积减半、厚度翻倍。'],
1:['硬币参照','厚度开始接近硬币和卡片。'],
2:['书本参照','厚度已经达到几厘米。'],
3:['人体 / 房间参照','纸面很小，厚度开始明显超过底面。'],
4:['高楼 / 珠峰参照','从这里开始，用“尺度线”比看纸块更直观。'],
5:['地球 / 月球参照','用地球直径和地月距离理解厚度。'],
6:['太阳系参照','用地日距离作为尺度尺。'],
7:['恒星际 / 银河系参照','厚度开始用光年来描述。'],
8:['宇宙尺度','数值继续指数增长，已经超出日常空间直觉。']};

let folds=0,timer=null,targetCam=new THREE.Vector3(),camLook=new THREE.Vector3(),stage=0;
const PAPER_MM=.1,LY=9.4607e15,MOON=384400000,AU=149597870700;
function fmt(mm){const m=mm/1000;if(mm<10)return mm.toLocaleString('zh-CN',{maximumFractionDigits:4})+' mm';if(m<1000)return m.toLocaleString('zh-CN',{maximumFractionDigits:3})+' m';if(m<1e9)return (m/1000).toLocaleString('zh-CN',{maximumFractionDigits:3})+' km';if(m<LY)return (m/1e9).toLocaleString('zh-CN',{maximumFractionDigits:3})+' 百万 km';return (m/LY).toExponential(3)+' 光年'}
function getStage(m,mm){if(mm<3)return mm<.4?0:1;if(m<.4)return 2;if(m<3)return 3;if(m<15000)return 4;if(m<AU)return 5;if(m<LY)return 6;if(m<1e5*LY)return 7;return 8}
function compare(m,mm){if(mm<.4)return '仍是一张很薄的纸。';if(mm<3)return '接近一枚硬币的厚度。';if(m<.4)return '接近一本书。';if(m<3)return '接近人的身高。';if(m<100)return '进入建筑尺度。';if(m<8849)return '正在逼近珠穆朗玛峰。';if(m<MOON)return '进入行星尺度。';if(m<AU)return '已经超过地月距离。';if(m<LY)return '超过地日距离，进入太阳系尺度。';const x=m/LY;if(x<1e5)return '约 '+x.toLocaleString('zh-CN',{maximumFractionDigits:2})+' 光年。';if(x<1e9)return '约 '+(x/1e6).toFixed(2)+' 百万光年。';return '约 '+(x/1e9).toFixed(2)+' 十亿光年。'}

function updateVisibility(s){
 [localGroup,cityGroup,earthGroup,solarGroup,galaxyGroup,cosmicGroup,rulerGroup].forEach(g=>g.visible=false);
 if(s<=3)localGroup.visible=true;
 else if(s===4){cityGroup.visible=true;rulerGroup.visible=true}
 else if(s===5){earthGroup.visible=true;rulerGroup.visible=true}
 else if(s===6){solarGroup.visible=true;rulerGroup.visible=true}
 else if(s===7){galaxyGroup.visible=true;cosmicGroup.visible=true;rulerGroup.visible=true}
 else {galaxyGroup.visible=true;cosmicGroup.visible=true;rulerGroup.visible=true}
}
function updateScene(){
 const layers=2**folds,mm=PAPER_MM*layers,m=mm/1000;
 stage=getStage(m,mm);updateVisibility(stage);
 document.getElementById('foldN').textContent=folds;
 document.getElementById('thick').textContent=fmt(mm);
 document.getElementById('layers').textContent=folds<53?Math.round(layers).toLocaleString('zh-CN')+' 层':layers.toExponential(3)+' 层';
 document.getElementById('compare').textContent=compare(m,mm);
 document.getElementById('slider').value=folds;
 let L=labels[stage];
 if(folds<=8){
   L=['真实折纸阶段','第 '+folds+' 次：纸面继续减半，厚度继续翻倍。'];
 }else if(m<3){
   L=['人体参照','白色尺度线 = 当前理论厚度；和人的身高做比较。'];
 }else if(m<8849){
   L=['高楼参照','白色尺度线 = 当前理论厚度；进入建筑尺度。'];
 }else if(m<4e7){
   L=['珠穆朗玛峰参照','珠峰约 8.8 km；厚度开始进入地理尺度。'];
 }else if(m<MOON){
   L=['地球参照','地球周长约 4 万 km；白线表示纸堆理论厚度。'];
 }else if(m<AU){
   L=['地月参照','地月平均距离约 38.44 万 km。'];
 }else if(m<LY){
   L=['太阳系参照','地日距离约 1.496 亿 km。'];
 }else if(m<4.24*LY){
   L=['最近恒星参照','太阳到比邻星约 4.24 光年。'];
 }else if(m<1e5*LY){
   L=['银河系参照','银河系直径约 10 万光年。'];
 }else{
   L=['宇宙尺度','白色尺度线只用于可视化，真实比例已无法直接放进屏幕。'];
 }
 document.getElementById('scaleTag').innerHTML='<b>'+L[0]+'</b><br>'+L[1];

 // Idealized geometry:
 // each fold halves one footprint dimension and doubles thickness.
 // We continue the footprint reduction beyond the visually foldable range,
 // but clamp only for renderability. The aspect therefore evolves:
 // sheet -> block -> tall pillar -> near-line.
 let w=2.1,d=2.97;
 for(let i=1;i<=folds;i++){if(i%2)d/=2;else w/=2}

 // Real proportions become astronomically extreme very quickly, so the 3D view uses
 // logarithmic compression while preserving the trend.
 const footprintReal=Math.sqrt(Math.max(w*d,1e-30));
 const fpVisual=Math.max(.045, 0.58*Math.pow(Math.max(footprintReal,1e-18),.22));
 const ratio=w/d;
 let vw=fpVisual*Math.sqrt(Math.max(ratio,.12));
 let vd=fpVisual/Math.sqrt(Math.max(ratio,.12));
 vw=Math.max(.035,Math.min(2.1,vw));
 vd=Math.max(.035,Math.min(2.97,vd));

 // Thickness grows exponentially in reality, but logarithmically in the camera view.
 // After ~10 folds this intentionally overtakes the footprint and becomes line-like.
 const visualThickness=Math.max(.03, Math.min(18, .03 + Math.pow(Math.log10(1+mm),1.32)*.58));
 paper.scale.set(vw/2.1,visualThickness/.03,vd/2.97);
 paper.position.y=visualThickness/2;
 paperGlow.scale.set((vw/2.16)*1.18,(visualThickness/.034)*1.03,(vd/3.03)*1.18);
 paperGlow.position.y=visualThickness/2;
 paperGroup.visible=folds<=8;
 paperGroup.scale.setScalar(1);

 // After fold 8, switch from "paper object" to a clear symbolic scale line.
 if(folds>8){
   rulerGroup.visible=true;
   const lineVisual = Math.min(18, 3.6 + Math.max(0,Math.log10(Math.max(mm,1)))*1.15);
   rulerLine.scale.y=lineVisual/10;
   rulerGlow.scale.y=lineVisual/10;
   rulerLine.position.y=lineVisual/2;
   rulerGlow.position.y=lineVisual/2;
   rulerCap1.position.y=0;
   rulerCap2.position.y=lineVisual;
 }

 // In cosmic stages the white beam is a symbolic "paper thickness" ruler.
 if(stage>=7){
   cosmicGroup.visible=true;
   const cosmicLen = stage===7 ? 10 : 16;
   beam.scale.y = cosmicLen/12;
   beamGlow.scale.y = cosmicLen/12;
   starA.visible=starB.visible=starGlowA.visible=starGlowB.visible=(stage===7);
 }

 // camera choreography
 if(stage===0){targetCam.set(0,3.25,6.3);camLook.set(0,0,0)}
 if(stage===1){targetCam.set(0,3.0,5.4);camLook.set(0,.18,0)}
 if(stage===2){targetCam.set(0,3.6,6.2);camLook.set(0,.45,0)}
 if(stage===3){targetCam.set(0,5.2,8.2);camLook.set(0,1.2,0)}
 if(stage===4){targetCam.set(8,9,20);camLook.set(0,3.2,0)}
 if(stage===5){targetCam.set(10,6,22);camLook.set(0,3.5,0)}
 if(stage===6){targetCam.set(12,8,28);camLook.set(0,4.0,0)}
 if(stage===7){targetCam.set(10,7,28);camLook.set(0,4.0,0)}
 if(stage>=8){targetCam.set(12,10,34);camLook.set(0,4.5,0)}
 document.getElementById('fold').disabled=folds>=100;
}
function setFold(n,flash=true){folds=Math.max(0,Math.min(100,+n));updateScene();if(flash){const f=document.getElementById('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}}
document.getElementById('fold').onclick=()=>setFold(folds+1);
document.getElementById('reset').onclick=()=>{clearInterval(timer);timer=null;setFold(0);document.getElementById('auto').textContent='自动折到 100 次'};
document.getElementById('slider').oninput=e=>{clearInterval(timer);timer=null;setFold(e.target.value,false);document.getElementById('auto').textContent='自动折到 100 次'};
document.getElementById('auto').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.getElementById('auto').textContent='自动折到 100 次';return}if(folds>=100)folds=0;document.getElementById('auto').textContent='停止自动演示';timer=setInterval(()=>{setFold(folds+1,false);if(folds>=100){clearInterval(timer);timer=null;document.getElementById('auto').textContent='自动折到 100 次'}},170)};

const panel=document.getElementById('panel');
const panelToggle=document.getElementById('panelToggle');
const scaleTag=document.getElementById('scaleTag');
function syncPanel(){
  const h=panel.getBoundingClientRect().height;
  scaleTag.style.bottom=(h+18)+'px';
}
panelToggle.onclick=()=>{
  panel.classList.toggle('collapsed');
  panelToggle.textContent=panel.classList.contains('collapsed')?'展开':'收起';
  requestAnimationFrame(syncPanel);
};
new ResizeObserver(syncPanel).observe(panel);
syncPanel();
